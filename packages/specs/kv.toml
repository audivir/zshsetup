#:schema https://raw.githubusercontent.com/zshsetup/pmg/main/schema.json
# the gnu build needs glibc 2.39; older glibc hosts get the musl build, which runs with the musl
# loader of pmg unless the host has one
min_glibc = "2.39"
platform_deps = { musl_x64 = ["musl"], musl_arm64 = ["musl"] }
bin = { kv = "{{ asset }}" }
post_install = '''
{% if deps.musl.dir %}
case "$(patchelf --print-interpreter "$PREFIX/bin/kv")" in
  */ld-musl-*)
    loader="$(echo {{ deps.musl.dir }}/lib/ld-musl-*.so.1)"
    patchelf --set-interpreter "$loader" "$PREFIX/bin/kv"
    ;;
esac
{% endif %}'''

test = "{{ cmd }} --version"
[external]
brew = "kv"

[release]
type = "github"
repo = "audivir/kv"

[download]
type = "github"

[assets]
glibc_x64 = "kv-x86_64-unknown-linux-gnu"
glibc_arm64 = "kv-aarch64-unknown-linux-gnu"
musl_x64 = "kv-x86_64-unknown-linux-musl"
musl_arm64 = "kv-aarch64-unknown-linux-musl"
macos_arm64 = "kv-aarch64-apple-darwin"
