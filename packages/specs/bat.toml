#:schema https://raw.githubusercontent.com/audivir/pmg-specs/main/schema.json
min_glibc = "2.18"
bin = { bat = "bat" }
man = ["bat.1"]
completions.bat.zsh = "autocomplete/bat.zsh"
completions.bat.bash = "autocomplete/bat.bash"
completions.bat.fish = "autocomplete/bat.fish"

[external]
brew = "bat"
apt = "bat"
apk = "bat"

[release]
type = "github"
repo = "sharkdp/bat"

[download]
type = "github"

[assets]
glibc_x64 = "bat-{{ tag }}-x86_64-unknown-linux-gnu.tar.gz"
glibc_arm64 = "bat-{{ tag }}-aarch64-unknown-linux-gnu.tar.gz"
musl_x64 = "bat-{{ tag }}-x86_64-unknown-linux-musl.tar.gz"
musl_arm64 = "bat-{{ tag }}-aarch64-unknown-linux-musl.tar.gz"
macos_arm64 = "bat-{{ tag }}-aarch64-apple-darwin.tar.gz"
