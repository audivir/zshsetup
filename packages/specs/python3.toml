# uv installs a standalone CPython, which is relocatable, into the package dir
deps = ["uv"]
check = { cmd = ["python3", "--version"] }

[external]
brew = "python3"
apt = "python3"
apk = "python3"

[release]
type = "command"
cmd = '''
uv python list --all-versions |
  grep -E "^cpython-3[.]12[.][0-9]+" |
  head -n 1 |
  sed -E "s/^cpython-([0-9.]+).*/\1/"
'''

[download]
type = "command"
cmd = '''
UV_PYTHON_INSTALL_DIR="$PREFIX/dir" uv python install --no-bin {{ version }}
python="{{ dir }}/$(cd "$PREFIX/dir" && echo cpython-*)/bin/python3"
ln -s "$python" "$PREFIX/bin/python3"
ln -s "$python" "$PREFIX/bin/python"
'''
