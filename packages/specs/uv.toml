min_glibc = "2.28"
bin = { uv = "uv", uvx = "uvx" }
completions.uv.zsh.cmd = "uv generate-shell-completion zsh"
completions.uv.bash.cmd = "uv generate-shell-completion bash"
completions.uv.fish.cmd = "uv generate-shell-completion fish"

[external]
brew = "uv"
apk = "uv"

[release]
type = "github"
repo = "astral-sh/uv"

[download]
type = "github"

[assets]
glibc_x64 = "uv-x86_64-unknown-linux-gnu.tar.gz"
glibc_arm64 = "uv-aarch64-unknown-linux-gnu.tar.gz"
musl_x64 = "uv-x86_64-unknown-linux-musl.tar.gz"
musl_arm64 = "uv-aarch64-unknown-linux-musl.tar.gz"
macos_arm64 = "uv-aarch64-apple-darwin.tar.gz"
