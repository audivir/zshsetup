deps = ["curl", "cc", "make"]
check = { cmd = ["gawk", "--version"] }
# zig ar lacks the u flag of the default ARFLAGS, and configure wants a linker in LD
post_install = '''
cd "$CONTENT"
export ARFLAGS=cr LD=cc
./configure --disable-nls --disable-dependency-tracking --disable-pma --disable-extensions \
  --without-readline --without-mpfr >/dev/null
make -j4 >/dev/null
cp gawk "$PREFIX/bin/gawk"
'''

[external]
brew = "gawk"
apt = "gawk"
apk = "gawk"

[release]
type = "command"
cmd = """
curl -fsSL https://ftp.gnu.org/gnu/gawk/ |
  grep -o 'gawk-[0-9.]*[.]tar.xz"' |
  sed 's/^gawk-//; s/[.]tar.xz"$//' |
  sort -t. -k1,1n -k2,2n -k3,3n |
  tail -n 1
"""

[download]
type = "url"
url = "https://ftp.gnu.org/gnu/gawk/{{ asset }}"

[assets]
glibc_x64 = "gawk-{{ version }}.tar.xz"
glibc_arm64 = "gawk-{{ version }}.tar.xz"
musl_x64 = "gawk-{{ version }}.tar.xz"
musl_arm64 = "gawk-{{ version }}.tar.xz"
macos_arm64 = "gawk-{{ version }}.tar.xz"
