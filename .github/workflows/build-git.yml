name: Build static git
# publishes the release that packages/git.sh installs from
on:
  workflow_dispatch:
    inputs:
      version:
        description: git version to build (e.g. 2.55.0)
        required: true
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
          - runner: macos-15
            target: macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.2
      - name: Build
        env:
          GIT_VER: ${{ inputs.version }}
          WORK: ${{ runner.temp }}/static-git-build
        run: packages/scripts/build_static_git.sh
      # git-cvsserver needs perl, which the build disables
      - name: Package
        run: |
          tree="$RUNNER_TEMP/static-git-build/out/usr/local"
          rm -f "$tree/bin/git-cvsserver" "$tree/libexec/git-core/git-cvsserver"
          tar -czf "git-${{ inputs.version }}-${{ matrix.target }}.tar.gz" -C "$tree" bin libexec share
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: git-${{ matrix.target }}
          path: git-${{ inputs.version }}-${{ matrix.target }}.tar.gz
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "git-v${{ inputs.version }}" git-*.tar.gz \
            --repo "${{ github.repository }}" --title "git ${{ inputs.version }} (static)" \
            --notes "Static git builds from packages/scripts/build_static_git.sh, installed by packages/git.sh."
