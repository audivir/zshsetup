name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: j178/prek-action@v3.0.0
  tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: ./tests/run_tests.sh
        env:
          PMG_GH_TOKEN: ${{ github.token }}
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: ./tests/run_tests.sh --native env packages lifecycle
        env:
          PMG_GH_TOKEN: ${{ github.token }}
